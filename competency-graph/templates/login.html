<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <title>Admin login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-light">
  <form method="post" class="p-4 bg-white rounded shadow" style="width: 320px;">
    <h5 class="mb-3 text-center">Admin sisselogimine</h5>
    <div class="mb-3">
      <label class="form-label">Kasutajanimi</label>
      <input type="text" name="username" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Parool</label>
      <input type="password" name="password" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Logi sisse</button>
    <div class="text-center mt-2">
      <a href="/">Tagasi avalehele</a>
    </div>
  </form>
</body>
</html>
